[package]
name = "ferrous-vcam-source"
description = "Ferrous Virtual Camera: the Media Foundation camera source (a COM DLL the Windows Frame Server loads)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ferrous_vcam_source"
crate-type = ["cdylib", "rlib"]

[dependencies]
ferrous-vcam.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization"] }
